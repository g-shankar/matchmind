# Generated by `matchmind-foundry export` from backend/src/matchmind/crew. Do not edit by hand.
schema: pitchpulse.agent-manifest/v1
name: pitchpulse-spotter
display_name: Spotter
role: Turns each match event plus the stats engine's numbers into moments worth telling.
runtime: deterministic
source: matchmind.crew.spotter.Spotter.spot
tools: []
guardrails:
- Input is typed facts from the PitchPulse stats engine only; no viewer free text reaches an agent.
model_steps: []
behaviour: |-
  Spotter: rule-based on purpose, so the same match always yields the same
  moments. It turns one event plus the stats engine's numbers into `Moment`s.

  Each moment's `facts` hold every number later text may use, already rounded
  the way it will be printed, plus the player and team names. Nothing here is
  free text from outside: names come from our fictional squads, numbers from the
  stats engine.
contract:
  input:
    $defs:
      BetterOption:
        description: 'Trigger 1: the shot taken versus the pass that was on.'
        properties:
          shot_event_id:
            title: Shot Event Id
            type: string
          shooter_id:
            title: Shooter Id
            type: string
          teammate_id:
            title: Teammate Id
            type: string
          shot_chance_quality:
            title: Shot Chance Quality
            type: number
          alt_chance_quality:
            title: Alt Chance Quality
            type: number
          pass_success:
            title: Pass Success
            type: number
          alt_value:
            description: pass_success x alt_chance_quality
            title: Alt Value
            type: number
          times_better:
            title: Times Better
            type: number
          pass_distance_m:
            title: Pass Distance M
            type: number
          nearest_marker_m:
            title: Nearest Marker M
            type: number
          shooter_pos:
            $ref: '#/$defs/XY'
          teammate_pos:
            $ref: '#/$defs/XY'
          defenders:
            items:
              $ref: '#/$defs/XY'
            title: Defenders
            type: array
          keeper:
            anyOf:
            - $ref: '#/$defs/XY'
            - type: 'null'
            default: null
        required:
        - shot_event_id
        - shooter_id
        - teammate_id
        - shot_chance_quality
        - alt_chance_quality
        - pass_success
        - alt_value
        - times_better
        - pass_distance_m
        - nearest_marker_m
        - shooter_pos
        - teammate_pos
        - defenders
        title: BetterOption
        type: object
      BodyPart:
        enum:
        - right_foot
        - left_foot
        - head
        title: BodyPart
        type: string
      Event:
        additionalProperties: false
        description: A single match event. One JSON object per line in the JSONL stream.
        properties:
          schema_version:
            const: '1.0'
            default: '1.0'
            title: Schema Version
            type: string
          event_id:
            title: Event Id
            type: string
          match_id:
            title: Match Id
            type: string
          seq:
            description: Strictly increasing order within a match.
            minimum: 0
            title: Seq
            type: integer
          ts:
            description: Wall-clock time the event happened (UTC).
            format: date-time
            title: Ts
            type: string
          period:
            maximum: 2
            minimum: 1
            title: Period
            type: integer
          clock_s:
            description: Match clock in seconds; period 2 starts at 2700.
            minimum: 0
            title: Clock S
            type: number
          match_clock:
            description: Broadcast clock, e.g. '67:20' or '90+2:15'.
            title: Match Clock
            type: string
          type:
            $ref: '#/$defs/EventType'
          team:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            title: Team
          player_id:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            title: Player Id
          receiver_id:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            description: Intended receiver of a pass (set even if incomplete).
            title: Receiver Id
          possession_id:
            anyOf:
            - type: integer
            - type: 'null'
            default: null
            title: Possession Id
          start:
            anyOf:
            - $ref: '#/$defs/Point'
            - type: 'null'
            default: null
          end:
            anyOf:
            - $ref: '#/$defs/Point'
            - type: 'null'
            default: null
          outcome:
            anyOf:
            - $ref: '#/$defs/Outcome'
            - type: 'null'
            default: null
          ball_speed_mps:
            anyOf:
            - minimum: 0
              type: number
            - type: 'null'
            default: null
            title: Ball Speed Mps
          player_speed_mps:
            anyOf:
            - minimum: 0
              type: number
            - type: 'null'
            default: null
            title: Player Speed Mps
          under_pressure:
            default: false
            title: Under Pressure
            type: boolean
          pressure_players:
            items:
              type: string
            title: Pressure Players
            type: array
          body_part:
            anyOf:
            - $ref: '#/$defs/BodyPart'
            - type: 'null'
            default: null
          freeze_frame:
            anyOf:
            - items:
                $ref: '#/$defs/FramePlayer'
              type: array
            - type: 'null'
            default: null
            description: 'Shots only: everyone in or around the box (final 35 m) at the moment of the shot.'
            title: Freeze Frame
          tracking:
            anyOf:
            - items:
                $ref: '#/$defs/TrackingFrame'
              type: array
            - type: 'null'
            default: null
            description: 'Runs only: runner, ball carrier, back line and keeper every 0.5 s for 3 s.'
            title: Tracking
          lineups:
            anyOf:
            - items:
                $ref: '#/$defs/LineupPlayer'
              type: array
            - type: 'null'
            default: null
            description: match_start only.
            title: Lineups
          details:
            additionalProperties:
              anyOf:
              - type: string
              - type: integer
              - type: number
              - type: boolean
            title: Details
            type: object
          labels:
            description: Ground-truth labels for evaluation (scripted beats, pressure spells). Consumers must strip
              these before anything reaches an agent.
            items:
              type: string
            title: Labels
            type: array
        required:
        - event_id
        - match_id
        - seq
        - ts
        - period
        - clock_s
        - match_clock
        - type
        title: Event
        type: object
      EventMetrics:
        description: Deterministic metrics for one event (absolute pitch coordinates).
        properties:
          event_id:
            title: Event Id
            type: string
          pass_distance_m:
            anyOf:
            - type: number
            - type: 'null'
            default: null
            title: Pass Distance M
          pass_difficulty:
            anyOf:
            - maximum: 100
              minimum: 0
              type: integer
            - type: 'null'
            default: null
            title: Pass Difficulty
          progressive:
            default: false
            title: Progressive
            type: boolean
          forward_m:
            anyOf:
            - type: number
            - type: 'null'
            default: null
            title: Forward M
          ball_speed_kmh:
            anyOf:
            - type: number
            - type: 'null'
            default: null
            title: Ball Speed Kmh
          player_speed_kmh:
            anyOf:
            - type: number
            - type: 'null'
            default: null
            title: Player Speed Kmh
          sprint:
            default: false
            title: Sprint
            type: boolean
          fast_shot:
            default: false
            title: Fast Shot
            type: boolean
          chance_quality:
            anyOf:
            - maximum: 1
              minimum: 0
              type: number
            - type: 'null'
            default: null
            title: Chance Quality
          distance_to_goal_m:
            anyOf:
            - type: number
            - type: 'null'
            default: null
            title: Distance To Goal M
          pitch_zone:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            title: Pitch Zone
          xt_delta:
            anyOf:
            - type: number
            - type: 'null'
            default: null
            title: Xt Delta
          better_option:
            anyOf:
            - $ref: '#/$defs/BetterOption'
            - type: 'null'
            default: null
          unfound_run:
            anyOf:
            - $ref: '#/$defs/UnfoundRun'
            - type: 'null'
            default: null
          sprint_efforts:
            anyOf:
            - items:
                $ref: '#/$defs/SprintTag'
              type: array
            - type: 'null'
            default: null
            description: 'Sprints (from synthetic tracking) that peaked since the previous event; None when no tracking
              is attached. Internal: not sent to clients.'
            title: Sprint Efforts
        required:
        - event_id
        title: EventMetrics
        type: object
      EventType:
        enum:
        - match_start
        - period_start
        - pass
        - carry
        - dribble
        - shot
        - run
        - interception
        - tackle
        - clearance
        - recovery
        - foul
        - card
        - milestone
        - period_end
        - match_end
        title: EventType
        type: string
      FramePlayer:
        description: One player's location inside a shot freeze frame or a tracking frame.
        properties:
          player_id:
            title: Player Id
            type: string
          team:
            title: Team
            type: string
          x:
            maximum: 105.0
            minimum: 0
            title: X
            type: number
          y:
            maximum: 68.0
            minimum: 0
            title: Y
            type: number
          teammate:
            description: True if on the same team as the event's actor.
            title: Teammate
            type: boolean
          keeper:
            default: false
            title: Keeper
            type: boolean
          actor:
            default: false
            title: Actor
            type: boolean
        required:
        - player_id
        - team
        - x
        - y
        - teammate
        title: FramePlayer
        type: object
      LineupPlayer:
        properties:
          player_id:
            title: Player Id
            type: string
          team:
            title: Team
            type: string
          name:
            title: Name
            type: string
          number:
            title: Number
            type: integer
          position:
            title: Position
            type: string
        required:
        - player_id
        - team
        - name
        - number
        - position
        title: LineupPlayer
        type: object
      MatchStateSnapshot:
        properties:
          match_id:
            title: Match Id
            type: string
          clock_s:
            title: Clock S
            type: number
          match_clock:
            title: Match Clock
            type: string
          period:
            title: Period
            type: integer
          home_id:
            title: Home Id
            type: string
          away_id:
            title: Away Id
            type: string
          score_home:
            title: Score Home
            type: integer
          score_away:
            title: Score Away
            type: integer
          home:
            $ref: '#/$defs/TeamWindow'
          away:
            $ref: '#/$defs/TeamWindow'
          momentum:
            description: + = home on top
            maximum: 100
            minimum: -100
            title: Momentum
            type: number
          control_chaos:
            description: -1 chaos ... +1 control
            maximum: 1
            minimum: -1
            title: Control Chaos
            type: number
          tempo:
            title: Tempo
            type: string
          events_per_min:
            title: Events Per Min
            type: number
          turnovers_per_min:
            title: Turnovers Per Min
            type: number
          avg_chain_passes:
            title: Avg Chain Passes
            type: number
          xg_home:
            title: Xg Home
            type: number
          xg_away:
            title: Xg Away
            type: number
          shots_home:
            title: Shots Home
            type: integer
          shots_away:
            title: Shots Away
            type: integer
        required:
        - match_id
        - clock_s
        - match_clock
        - period
        - home_id
        - away_id
        - score_home
        - score_away
        - home
        - away
        - momentum
        - control_chaos
        - tempo
        - events_per_min
        - turnovers_per_min
        - avg_chain_passes
        - xg_home
        - xg_away
        - shots_home
        - shots_away
        title: MatchStateSnapshot
        type: object
      Outcome:
        enum:
        - complete
        - incomplete
        - out
        - won
        - goal
        - saved
        - blocked
        - off_target
        - found
        - not_found
        title: Outcome
        type: string
      PlayerStats:
        properties:
          player_id:
            title: Player Id
            type: string
          team:
            title: Team
            type: string
          touches:
            default: 0
            title: Touches
            type: integer
          passes:
            default: 0
            title: Passes
            type: integer
          passes_completed:
            default: 0
            title: Passes Completed
            type: integer
          key_passes:
            default: 0
            title: Key Passes
            type: integer
          shots:
            default: 0
            title: Shots
            type: integer
          shots_on_target:
            default: 0
            title: Shots On Target
            type: integer
          goals:
            default: 0
            title: Goals
            type: integer
          assists:
            default: 0
            title: Assists
            type: integer
          xg:
            default: 0.0
            title: Xg
            type: number
          xa:
            default: 0.0
            title: Xa
            type: number
          tackles_won:
            default: 0
            title: Tackles Won
            type: integer
          tackles_lost:
            default: 0
            description: 'Challenges lost: dribbled past by the ball carrier.'
            title: Tackles Lost
            type: integer
          interceptions:
            default: 0
            title: Interceptions
            type: integer
          top_speed_kmh:
            default: 0.0
            title: Top Speed Kmh
            type: number
          sprints:
            default: 0
            title: Sprints
            type: integer
          carry_distance_m:
            default: 0.0
            title: Carry Distance M
            type: number
          distance_km:
            default: 0.0
            title: Distance Km
            type: number
          walk_km:
            default: 0.0
            title: Walk Km
            type: number
          jog_km:
            default: 0.0
            title: Jog Km
            type: number
          run_km:
            default: 0.0
            title: Run Km
            type: number
          sprint_km:
            default: 0.0
            title: Sprint Km
            type: number
          physical_source:
            default: event_estimate
            description: 'synthetic_tracking: distance, speed bands, sprints and top speed come from the 25 Hz synthetic
              tracking. event_estimate: distance is a lower bound from event positions and sprints/top speed come
              from recorded action speeds.'
            enum:
            - synthetic_tracking
            - event_estimate
            title: Physical Source
            type: string
        required:
        - player_id
        - team
        title: PlayerStats
        type: object
      Point:
        properties:
          x:
            maximum: 105.0
            minimum: 0
            title: X
            type: number
          y:
            maximum: 68.0
            minimum: 0
            title: Y
            type: number
        required:
        - x
        - y
        title: Point
        type: object
      SprintTag:
        description: A sprint seen in the synthetic tracking (stats.physical).
        properties:
          player_id:
            title: Player Id
            type: string
          period:
            title: Period
            type: integer
          peak_clock_s:
            title: Peak Clock S
            type: number
          peak_kmh:
            title: Peak Kmh
            type: number
          distance_m:
            title: Distance M
            type: number
        required:
        - player_id
        - period
        - peak_clock_s
        - peak_kmh
        - distance_m
        title: SprintTag
        type: object
      TeamWindow:
        description: Rolling five-minute numbers for one team.
        properties:
          possession_pct:
            title: Possession Pct
            type: number
          field_tilt_pct:
            title: Field Tilt Pct
            type: number
          pressure_index:
            maximum: 100
            minimum: 0
            title: Pressure Index
            type: number
          shots:
            title: Shots
            type: integer
          xg:
            title: Xg
            type: number
          final_third_passes:
            title: Final Third Passes
            type: integer
          box_entries:
            title: Box Entries
            type: integer
        required:
        - possession_pct
        - field_tilt_pct
        - pressure_index
        - shots
        - xg
        - final_third_passes
        - box_entries
        title: TeamWindow
        type: object
      TrackingFrame:
        description: Positions at one instant inside a run window (every 0.5 s).
        properties:
          t_offset_s:
            minimum: 0
            title: T Offset S
            type: number
          ball:
            $ref: '#/$defs/Point'
          players:
            items:
              $ref: '#/$defs/FramePlayer'
            title: Players
            type: array
        required:
        - t_offset_s
        - ball
        - players
        title: TrackingFrame
        type: object
      UnfoundRun:
        description: 'Trigger 2: a run in behind where the through ball was on but never came.'
        properties:
          run_event_id:
            title: Run Event Id
            type: string
          runner_id:
            title: Runner Id
            type: string
          carrier_id:
            title: Carrier Id
            type: string
          found:
            title: Found
            type: boolean
          pass_on_at_s:
            description: Seconds into the run when the pass was on
            title: Pass On At S
            type: number
          pass_on_clock:
            title: Pass On Clock
            type: string
          clear_of_line_m:
            description: How far beyond the back line the runner got
            title: Clear Of Line M
            type: number
          projected_chance_quality:
            title: Projected Chance Quality
            type: number
          one_on_one:
            title: One On One
            type: boolean
          carrier_pos:
            $ref: '#/$defs/XY'
          runner_path:
            items:
              $ref: '#/$defs/XY'
            title: Runner Path
            type: array
          target:
            $ref: '#/$defs/XY'
          defenders_at_pass:
            items:
              $ref: '#/$defs/XY'
            title: Defenders At Pass
            type: array
        required:
        - run_event_id
        - runner_id
        - carrier_id
        - found
        - pass_on_at_s
        - pass_on_clock
        - clear_of_line_m
        - projected_chance_quality
        - one_on_one
        - carrier_pos
        - runner_path
        - target
        - defenders_at_pass
        title: UnfoundRun
        type: object
      XY:
        properties:
          x:
            title: X
            type: number
          y:
            title: Y
            type: number
        required:
        - x
        - y
        title: XY
        type: object
    description: One event with the stats engine's numbers at that moment.
    properties:
      event:
        $ref: '#/$defs/Event'
      metrics:
        $ref: '#/$defs/EventMetrics'
      snapshot:
        $ref: '#/$defs/MatchStateSnapshot'
      players:
        additionalProperties:
          $ref: '#/$defs/PlayerStats'
        title: Players
        type: object
    required:
    - event
    - metrics
    - snapshot
    - players
    title: SpotterIn
    type: object
  output:
    $defs:
      Moment:
        description: 'Spotter output: something worth telling, with the numbers that back it.'
        properties:
          moment_id:
            title: Moment Id
            type: string
          kind:
            $ref: '#/$defs/MomentKind'
          clock_s:
            title: Clock S
            type: number
          match_clock:
            title: Match Clock
            type: string
          period:
            title: Period
            type: integer
          team:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            title: Team
          player_ids:
            items:
              type: string
            title: Player Ids
            type: array
          players:
            description: Identity of each player in player_ids, same order.
            items:
              $ref: '#/$defs/PlayerRef'
            title: Players
            type: array
          facts:
            additionalProperties:
              anyOf:
              - type: string
              - type: integer
              - type: number
              - type: boolean
            description: The only numbers any agent may say about this moment.
            title: Facts
            type: object
          source_event_ids:
            items:
              type: string
            title: Source Event Ids
            type: array
          priority:
            maximum: 100
            minimum: 0
            title: Priority
            type: integer
        required:
        - moment_id
        - kind
        - clock_s
        - match_clock
        - period
        - source_event_ids
        - priority
        title: Moment
        type: object
      MomentKind:
        enum:
        - goal
        - card
        - big_chance
        - better_option
        - unfound_run
        - momentum_swing
        - pressure_spell
        - speed_burst
        - rocket_shot
        - distance_milestone
        - hard_pass
        - key_tackle
        - milestone
        title: MomentKind
        type: string
      PlayerRef:
        description: |-
          A player's resolved identity, so overlays can tag him by name and shirt
          number without a second lookup. Names come from our fictional squads.
        properties:
          player_id:
            title: Player Id
            type: string
          name:
            title: Name
            type: string
          number:
            title: Number
            type: integer
          team:
            title: Team
            type: string
          position:
            title: Position
            type: string
        required:
        - player_id
        - name
        - number
        - team
        - position
        title: PlayerRef
        type: object
    properties:
      moments:
        items:
          $ref: '#/$defs/Moment'
        title: Moments
        type: array
    required:
    - moments
    title: SpotterOut
    type: object
