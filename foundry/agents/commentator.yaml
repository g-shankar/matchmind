        - es
        - fr
        - ar
        - ja
        - pt
        - de
        - hi
        - zh-Hans
        - sw
        - id
        - tr
        - ko
        title: Language
        type: string
      headline:
        maxLength: 80
        title: Headline
        type: string
      body:
        maxLength: 400
        title: Body
        type: string
      produced_by:
        enum:
        - ai
        - template
        title: Produced By
        type: string
      fallback_reason:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Fallback Reason
    required:
