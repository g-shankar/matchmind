[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "matchmind"
version = "0.1.0"
description = "Multi-agent match intelligence on synthetic football data (Microsoft x Premier League 'Inside the Game' hackathon)."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
azure = [
    "azure-eventhub>=5.11",
    "azure-identity>=1.17",
    "httpx>=0.27",  # Azure AI Translator (REST)
]
analytics = [
    "pyarrow>=15",
]
ai = [
    "openai>=1.40",
    "azure-identity>=1.17",
    "httpx>=0.27",  # Azure AI Translator (REST)
]
# Microsoft Foundry Agent Service runtime for the model steps (MATCHMIND_LLM_PROVIDER=foundry_agents)
# and `matchmind-foundry register / trace-demo`.
foundry = [
    "azure-ai-projects>=2.9,<3",
    "azure-identity>=1.17",
    "openai>=3.0",
]
# Microsoft Agent Framework orchestration of the crew (MATCHMIND_ORCHESTRATOR=agent_framework).
# The core package only: the `agent-framework` meta-package pulls every connector.
agent-framework = [
    "agent-framework-core>=1.22,<2",
]
observability = [
    "azure-monitor-opentelemetry>=1.6",
    "azure-identity>=1.17",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.25",
]

[project.scripts]
matchmind-sim = "matchmind.simulator.cli:main"
matchmind-api = "matchmind.api.__main__:main"
matchmind-autoevent = "matchmind.autoevent.cli:main"
matchmind-lakehouse = "matchmind.analytics.cli:main"
matchmind-foundry = "matchmind.foundry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/matchmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM115"]

[tool.ruff.lint.per-file-ignores]
# Phrase tables: one natural-language sentence per string reads better unwrapped.
"src/matchmind/crew/i18n/*.py" = ["E501"]
