- contentinfo "About this demo":
  - heading "About this demo" [level=2]
  - paragraph: PitchPulse explains the moments that matter in a match for a fan, an analyst or a stats scout, in their language. Every number comes from the stats engine, and a fact-checker checks each sentence before it is shown.
  - paragraph: All clubs, players and matches here are invented (synthetic data). No real league, club, player or broadcaster is shown.
  - paragraph: In this demo the explanations are written from fact-checked templates; paid AI services are switched off.
  - button "How it works"
  - paragraph: Made by the PitchPulse team as a hackathon entry, 2026.